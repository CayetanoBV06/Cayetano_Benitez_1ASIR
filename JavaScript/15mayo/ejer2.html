<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Ingrese numero:<input type="number" id="num1"></p>
        <p>Ingrese numero:<input type="number" id="num2"></p>
        <p>Ingrese numero:<input type="number" id="num3"></p>
        <p>Ingrese numero:<input type="number" id="num4"></p>
        <p>Ingrese numero:<input type="number" id="num5"></p>
        <p>Ingrese numero:<input type="number" id="num6"></p>
        <p>Ingrese numero:<input type="number" id="num7"></p>
        <p>Ingrese numero:<input type="number" id="num8"></p>

        <button type="button" value="+" onClick="suma()">
                <p></p>Resultado:<p id = "resul"></p>

    <script>
        /*
        pedir dos numeros en un formulario y visualizar su suma
        */
        function suma() {
            resul=0;
            for(let i=1;i<=8;i++){
                resul += parseFloat(document.getElementById("num"+i).value);
            }
            document.getElementById('resul').innerHTML = "La suma es "+ resul;
        }
    </script>
</body>
</html>
