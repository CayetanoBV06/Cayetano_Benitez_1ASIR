<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
   /*
       Pedir notas repetidamente de in alumno hasta que el valor dictado sea -99, en el momento qu el valor sea -99
       visualizar la media de las notas introducidas
   */




function encontrar(){
   let sum = 0
   let sw = 0
   let conta = 0
   while(sw === 0){
       let nota = parseInt(prompt("Introduce la nota"))
       if(nota === -99){
           sw = 1
       } else {
           sum += nota
           conta++
       }
   }
   return sum / conta
}
function Visualizar(dato){
   document.write("La media es: " + dato)
}
resul = encontrar()
Visualizar(resul)
   </script>
</body>
</html>
