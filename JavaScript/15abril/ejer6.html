<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
       /*
           Pedir datos numericos al usuario hasta que de el -99, entonces Visualizar el mayor de los numeros
       */


        function encontrar(){
   let aux = -99999
   let sw = 0
   while(sw === 0){
       let num = parseInt(prompt("Introduce la nota"))
       if(num === -99){
           sw = 1
       } else{
           if(num>aux){
               aux=num
           }
       }
   }
   return aux
        }


function Visualizar(dato){
   document.write("El numero mayor es: ", dato)
}
resul=encontrar()
Visualizar(resul)
   </script>
</body>
</html>
