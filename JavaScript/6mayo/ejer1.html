<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*declarar un array que tenga el nombre de un alumno y sus notas y calcular la media*/

        let alumno = ["Cayetano",5,6,2,9]

        function Media(alum){
            suma = 0
            media = 0
            for(i=1;i<alum.length;i++){
                suma+=alum[i]
                media = suma/(alum.length-1)
            }
            return media
        }

        function Visualizar(dato,arr){
            document.write("La media de ",arr[0]," es ",dato,)
        }

        resul=Media(alumno)
        Visualizar(resul,alumno)
    </script>
</body>
</html>
